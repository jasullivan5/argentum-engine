name: Application compatibility
on:
  pull_request:
    branches: [app-stable]
  push:
    branches: [app-stable]
  workflow_dispatch:
    inputs:
      application_ref:
        description: Application ref to validate (main normally)
        required: false
        default: main
permissions:
  contents: read
jobs:
  application-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: argentum-engine
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: jasullivan5/mtg-deckbuilding-assistant
          ref: ${{ inputs.application_ref || 'main' }}
          path: mtg-deckbuilding-assistant
      - name: Require sibling integration in application
        run: |
          if [ ! -f mtg-deckbuilding-assistant/argentum.init.gradle ] || [ ! -f mtg-deckbuilding-assistant/dev ]; then
            echo "::error::Application ref must expose the sibling-engine Gradle integration and dev wrapper."
            exit 1
          fi
      - name: Identify exact engine candidate
        working-directory: argentum-engine
        run: |
          echo "ARGENTUM_ENGINE_DIR=$GITHUB_WORKSPACE/argentum-engine" >> "$GITHUB_ENV"
          echo "ARGENTUM_CANDIDATE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Engine under test: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Application: $(git -C ../mtg-deckbuilding-assistant rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Native rules regressions
        working-directory: argentum-engine
        run: bash scripts/gradle-locked --no-daemon --no-configuration-cache --max-workers=2 -PkotlinCompileParallelism=1 -Pkotlin.daemon.jvmargs=-Xmx4g :rules-engine:test
      - name: Application compatibility
        id: application
        working-directory: mtg-deckbuilding-assistant
        run: |
          bash scripts/bootstrap.sh
          # Discover the one generated provenance record; application source/module
          # layout is owned by the application, not this compatibility workflow.
          mapfile -t metadata < <(find . -type d \( -name .git -o -name node_modules -o -name 'archive-export-*' \) -prune -o -type f -path '*/build/generated/engine-resources/engine-build.properties' -print)
          if [ "${#metadata[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one generated engine provenance record."
            exit 1
          fi
          build_directory=${metadata[0]%/generated/engine-resources/engine-build.properties}
          echo "build-directory=${build_directory#./}" >> "$GITHUB_OUTPUT"
          grep -Fx "revision=$ARGENTUM_CANDIDATE_REVISION" "${metadata[0]}"
          grep -Fx 'mode=candidate' "${metadata[0]}"
          ./dev test
          python3 scripts/test-bootstrap.py
          bash scripts/check-catalog.sh
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-compatibility
          path: |
            mtg-deckbuilding-assistant/${{ steps.application.outputs.build-directory }}/generated/engine-resources/
            mtg-deckbuilding-assistant/${{ steps.application.outputs.build-directory }}/reports/tests/
            mtg-deckbuilding-assistant/generated/verification/catalog/comparison-summary.json
            mtg-deckbuilding-assistant/generated/handoff/catalog/comparison-summary.json
            argentum-engine/rules-engine/build/reports/tests/
